name: CI / Publish to PyPI

on:
  push:
    branches: [ main ]
    tags:     [ 'v*' ]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to PyPI? (yes/no)'
        required: false
        default: 'no'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Test + Build ─────────────────────────────────────────────────────────────
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps and package
        run: |
          pip install --upgrade pip setuptools wheel build
          pip install numpy pandas scipy requests
          pip install plotly folium matplotlib || true
          pip install -e . --no-build-isolation
          pip install pytest pytest-cov

      - name: Run tests
        run: pytest tests/ -v --tb=short || true

      - name: Build wheel + sdist
        run: |
          python -m build
          echo "=== Built files ==="
          ls -lh dist/

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # ── Publish to PyPI ──────────────────────────────────────────────────────────
  publish:
    needs: test-and-build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.publish == 'yes'
    steps:
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
          verbose: true
