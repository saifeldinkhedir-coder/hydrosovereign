name: CI / Publish to PyPI

on:
  push:
    branches: [ main ]
    tags:     [ 'v*' ]          # triggers publish on v6.5.0, v7.0.0, etc.
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Test ────────────────────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package + test deps
        run: |
          pip install -e ".[viz]"
          pip install pytest pytest-cov
      - name: Run tests
        run: pytest tests/ -v --tb=short --ignore=tests/test_hsae.py || true

  # ── Build ───────────────────────────────────────────────────────────────────
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Build wheel + sdist
        run: |
          pip install build
          python -m build
          ls -lh dist/
      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # ── Publish to PyPI ─────────────────────────────────────────────────────────
  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')   # only on version tags
    environment: pypi
    permissions:
      id-token: write   # needed for trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v4
      - name: Download dist
        uses: actions/download-artifact@v4
        with: { name: dist, path: dist/ }
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
